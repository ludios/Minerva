[project]
name = "Minerva"
version = "26.10.0"
description = "Robust Comet server and client built on Twisted and Closure Library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Ivan Kozik", email = "ivan@ludios.org" }]
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Twisted",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
    "twisted>=25.5",
]

[project.urls]
Homepage = "https://ludios.org/minerva/"
Source = "https://github.com/ludios/Minerva"

[project.scripts]
minerva-site = "minerva.site:main"

[project.optional-dependencies]
demos = [
    "twisted[tls,websocket]>=26.4",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "hypothesis>=6.150",
    "websockets>=15",
    "pytest>=9.0",
    "ruff>=0.17",
    "ty>=0.0.89",
    "twisted[tls,websocket]>=26.4",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "minerva"


[tool.ruff]
target-version = "py315"
extend-exclude = [
    # Untracked work-in-progress left by the author; not part of the package.
    "minerva/",
]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "N",            # pep8-naming
    "C4",           # comprehensions
    "SIM",          # simplify
    "RET",          # return
    "PIE",
    "PT",           # pytest style
    "PERF",
    "FURB",
    "PGH",
    "RUF",
    "ANN",          # require annotations (relaxed for tests below)
]
ignore = [
    "ANN401",  # `Any` is occasionally the honest type (e.g. JSON from the wire)
    "SIM108",  # ternaries aren't always clearer
    "RET505",  # `else` after `return` sometimes reads better
    "N818",    # domain names like `InvalidFrame` read better than `InvalidFrameError`
]

[tool.ruff.lint.pep8-naming]
# Methods that implement a *Twisted* interface must keep Twisted's camelCase
# names, because Twisted (or Twisted-style producers) call them.  Everything
# that Minerva itself owns is snake_case.
extend-ignore-names = [
    "abortConnection",
    "addSystemEventTrigger",
    "buildProtocol",
    "bytesMessageReceived",
    "callLater",
    "connectionLost",
    "connectionMade",
    "dataReceived",
    "getChild",
    "getHost",
    "isLeaf",
    "makeConnection",
    "negotiationFinished",
    "negotiationStarted",
    "pauseProducing",
    "pongReceived",
    "registerProducer",
    "requestHeaders",
    "render_GET",
    "render_POST",
    "responseHeaders",
    "resumeProducing",
    "setTcpNoDelay",
    "stopProducing",
    "textMessageReceived",
    "unregisterProducer",
]

[tool.ruff.lint.per-file-ignores]
# The tutorials embed their (long-lined) HTML pages.
"src/minerva/tutorial/*" = ["E501"]
"tests/**" = [
    "ANN",
    "PT011",  # `pytest.raises(ValueError)` is often exactly the contract
]


[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
exclude = ["minerva/"]


[tool.coverage.run]
source_pkgs = ["minerva"]
branch = true
# Measure the subprocesses (minerva-site, the browser test server) too.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\.$"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "browser: end-to-end tests in headless Chrome or a Flash browser (deselect with -m 'not browser')",
]
filterwarnings = [
    "error",
    # Twisted's own twisted.web.static triggers this when it's imported.
    "ignore:twisted\\.web\\.resource\\._Unsafe:DeprecationWarning",
]
